<svg viewBox="0 0 1500 1050" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="crow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1,1 L10,7 L1,13" fill="none" stroke="#5b6b7c" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect width="1500" height="1050" fill="#ffffff"/>
  <text x="750" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a2c3d">Fintech Platform &#8212; Entity Relationship Overview</text>
  <text x="290" y="92" text-anchor="start" font-size="12.5" fill="#647688">13 core entities &#8226; double-entry ledger &#8226; PCI-DSS card handling</text>

  <!-- ============ ENTITY BOXES ============ -->
  <!-- USER -->
  <g id="USER">
    <rect x="50" y="120" width="190" height="86" rx="8" fill="#eef5fb" stroke="#2c6fa6" stroke-width="2"/>
    <rect x="50" y="120" width="190" height="28" rx="8" fill="#2c6fa6"/>
    <text x="145" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">USER</text>
    <text x="62" y="167" font-size="11.5" fill="#1a2c3d">user_id (PK)</text>
    <text x="62" y="184" font-size="11" fill="#41566b">username, email, DOB...</text>
    <text x="62" y="199" font-size="11" fill="#41566b">kyc_status, 2FA_enabled</text>
  </g>

  <!-- KYC_VERIFICATION -->
  <g id="KYC">
    <rect x="50" y="250" width="190" height="70" rx="8" fill="#fef6ec" stroke="#c98a2e" stroke-width="2"/>
    <rect x="50" y="250" width="190" height="26" rx="8" fill="#c98a2e"/>
    <text x="145" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">KYC_VERIFICATION</text>
    <text x="62" y="294" font-size="11" fill="#1a2c3d">kyc_id (PK)</text>
    <text x="62" y="309" font-size="10.5" fill="#41566b">user_id (FK), doc_type, status</text>
  </g>

  <!-- ACCOUNT -->
  <g id="ACCOUNT">
    <rect x="330" y="120" width="200" height="110" rx="8" fill="#eef5fb" stroke="#2c6fa6" stroke-width="2"/>
    <rect x="330" y="120" width="200" height="28" rx="8" fill="#2c6fa6"/>
    <text x="430" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ACCOUNT</text>
    <text x="342" y="165" font-size="11.5" fill="#1a2c3d">account_id (PK)</text>
    <text x="342" y="180" font-size="11" fill="#41566b">user_id (FK), account_type</text>
    <text x="342" y="195" font-size="11" fill="#41566b">currency_code (FK), status</text>
    <text x="342" y="212" font-size="10.5" fill="#a33" font-style="italic">balance: DERIVED</text>
    <text x="342" y="225" font-size="10.5" fill="#a33" font-style="italic">(see ledger, below)</text>
  </g>

  <!-- CURRENCY -->
  <g id="CURRENCY">
    <rect x="640" y="50" width="160" height="62" rx="8" fill="#f1eef7" stroke="#6a4c93" stroke-width="2"/>
    <rect x="640" y="50" width="160" height="24" rx="8" fill="#6a4c93"/>
    <text x="720" y="67" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">CURRENCY</text>
    <text x="650" y="92" font-size="10.5" fill="#1a2c3d">currency_code (PK)</text>
    <text x="650" y="105" font-size="10" fill="#41566b">symbol, decimal_places</text>
  </g>

  <!-- LEDGER_ENTRY -->
  <g id="LEDGER">
    <rect x="610" y="150" width="210" height="100" rx="8" fill="#eafaf1" stroke="#1f9d61" stroke-width="2.4"/>
    <rect x="610" y="150" width="210" height="28" rx="8" fill="#1f9d61"/>
    <text x="715" y="169" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">LEDGER_ENTRY (core)</text>
    <text x="622" y="197" font-size="11.5" fill="#1a2c3d">entry_id (PK)</text>
    <text x="622" y="212" font-size="11" fill="#41566b">account_id (FK), txn_id (FK)</text>
    <text x="622" y="227" font-size="11" fill="#41566b">direction (DEBIT/CREDIT)</text>
    <text x="622" y="242" font-size="11" fill="#41566b">amount_minor, running_balance</text>
  </g>

  <!-- TRANSACTION -->
  <g id="TRANSACTION">
    <rect x="900" y="150" width="210" height="100" rx="8" fill="#eef5fb" stroke="#2c6fa6" stroke-width="2"/>
    <rect x="900" y="150" width="210" height="28" rx="8" fill="#2c6fa6"/>
    <text x="1005" y="169" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">TRANSACTION</text>
    <text x="912" y="197" font-size="11.5" fill="#1a2c3d">transaction_id (PK)</text>
    <text x="912" y="212" font-size="11" fill="#41566b">sender_account_id (FK)</text>
    <text x="912" y="227" font-size="11" fill="#41566b">receiver_account_id (FK)</text>
    <text x="912" y="242" font-size="11" fill="#41566b">card_id (FK, nullable), status</text>
  </g>

  <!-- CARD -->
  <g id="CARD">
    <rect x="900" y="290" width="210" height="100" rx="8" fill="#fdeeee" stroke="#b03a3a" stroke-width="2"/>
    <rect x="900" y="290" width="210" height="28" rx="8" fill="#b03a3a"/>
    <text x="1005" y="309" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">CARD</text>
    <text x="912" y="337" font-size="11.5" fill="#1a2c3d">card_id (PK)</text>
    <text x="912" y="352" font-size="11" fill="#41566b">account_id (FK), provider_id (FK)</text>
    <text x="912" y="367" font-size="10.5" fill="#a33" font-style="italic">card_token (NOT raw PAN)</text>
    <text x="912" y="381" font-size="10.5" fill="#41566b">pan_last4, pan_bin, expiry</text>
  </g>

  <!-- CARD_PROVIDER -->
  <g id="PROVIDER">
    <rect x="1180" y="290" width="180" height="70" rx="8" fill="#f1eef7" stroke="#6a4c93" stroke-width="2"/>
    <rect x="1180" y="290" width="180" height="24" rx="8" fill="#6a4c93"/>
    <text x="1270" y="307" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">CARD_PROVIDER</text>
    <text x="1190" y="332" font-size="10.5" fill="#1a2c3d">provider_id (PK)</text>
    <text x="1190" y="345" font-size="10" fill="#41566b">name (Visa, MC, Verve...)</text>
  </g>

  <!-- LOAN -->
  <g id="LOAN">
    <rect x="330" y="420" width="200" height="110" rx="8" fill="#fff6e8" stroke="#c98a2e" stroke-width="2"/>
    <rect x="330" y="420" width="200" height="28" rx="8" fill="#c98a2e"/>
    <text x="430" y="439" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">LOAN</text>
    <text x="342" y="467" font-size="11.5" fill="#1a2c3d">loan_id (PK)</text>
    <text x="342" y="482" font-size="11" fill="#41566b">account_id (FK), loan_type</text>
    <text x="342" y="497" font-size="11" fill="#41566b">principal_minor, interest_rate</text>
    <text x="342" y="512" font-size="11" fill="#41566b">balance_remaining_minor</text>
    <text x="342" y="524" font-size="10" fill="#a33" font-style="italic">linked via transaction.loan_id</text>
  </g>

  <!-- LOAN_REPAYMENT_SCHEDULE -->
  <g id="SCHEDULE">
    <rect x="50" y="420" width="220" height="92" rx="8" fill="#fff6e8" stroke="#c98a2e" stroke-width="2"/>
    <rect x="50" y="420" width="220" height="26" rx="8" fill="#c98a2e"/>
    <text x="160" y="438" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">LOAN_REPAYMENT_SCHEDULE</text>
    <text x="62" y="463" font-size="11" fill="#1a2c3d">schedule_id (PK)</text>
    <text x="62" y="478" font-size="10.5" fill="#41566b">loan_id (FK), due_date</text>
    <text x="62" y="492" font-size="10.5" fill="#41566b">installment_amount, paid_flag</text>
  </g>

  <!-- INVOICE -->
  <g id="INVOICE">
    <rect x="610" y="420" width="190" height="92" rx="8" fill="#eef5fb" stroke="#2c6fa6" stroke-width="2"/>
    <rect x="610" y="420" width="190" height="26" rx="8" fill="#2c6fa6"/>
    <text x="705" y="438" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">INVOICE</text>
    <text x="622" y="463" font-size="11" fill="#1a2c3d">invoice_id (PK)</text>
    <text x="622" y="478" font-size="10.5" fill="#41566b">account_id (FK), txn_id (FK)</text>
    <text x="622" y="492" font-size="10.5" fill="#41566b">amount_due, due_date, status</text>
  </g>

  <!-- INVESTMENT -->
  <g id="INVESTMENT">
    <rect x="900" y="450" width="210" height="110" rx="8" fill="#e9f2fb" stroke="#2c6fa6" stroke-width="2"/>
    <rect x="900" y="450" width="210" height="28" rx="8" fill="#2c6fa6"/>
    <text x="1005" y="469" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">INVESTMENT_HOLDING</text>
    <text x="912" y="497" font-size="11.5" fill="#1a2c3d">holding_id (PK)</text>
    <text x="912" y="512" font-size="11" fill="#41566b">account_id (FK), security_id (FK)</text>
    <text x="912" y="527" font-size="11" fill="#41566b">quantity, avg_cost_minor</text>
    <text x="912" y="542" font-size="10" fill="#41566b">link_id (FK &#8594; ext. brokerage)</text>
  </g>

  <!-- SECURITY -->
  <g id="SECURITY">
    <rect x="1180" y="450" width="180" height="78" rx="8" fill="#f1eef7" stroke="#6a4c93" stroke-width="2"/>
    <rect x="1180" y="450" width="180" height="24" rx="8" fill="#6a4c93"/>
    <text x="1270" y="467" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">SECURITY</text>
    <text x="1190" y="491" font-size="10.5" fill="#1a2c3d">security_id (PK)</text>
    <text x="1190" y="504" font-size="10" fill="#41566b">name, ticker, asset_type</text>
    <text x="1190" y="517" font-size="10" fill="#41566b">(stock/bond/ETF/fund)</text>
  </g>

  <!-- EXTERNAL_INVESTMENT_LINK -->
  <g id="EXTLINK">
    <rect x="1180" y="555" width="200" height="86" rx="8" fill="#f1eef7" stroke="#6a4c93" stroke-width="2"/>
    <rect x="1180" y="555" width="200" height="26" rx="8" fill="#6a4c93"/>
    <text x="1280" y="573" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">EXTERNAL_BROKERAGE_LINK</text>
    <text x="1190" y="598" font-size="10.5" fill="#1a2c3d">link_id (PK)</text>
    <text x="1190" y="611" font-size="10" fill="#41566b">user_id (FK), provider_name</text>
    <text x="1190" y="624" font-size="10" fill="#41566b">oauth_token_ref, last_synced_at</text>
  </g>

  <!-- AUDIT_LOG -->
  <g id="AUDIT">
    <rect x="50" y="600" width="220" height="80" rx="8" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="2"/>
    <rect x="50" y="600" width="220" height="26" rx="8" fill="#6b6b6b"/>
    <text x="160" y="618" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">AUDIT_LOG</text>
    <text x="62" y="643" font-size="10.5" fill="#1a2c3d">audit_id (PK)</text>
    <text x="62" y="656" font-size="10" fill="#41566b">actor_id, entity_type, entity_id,</text>
    <text x="62" y="668" font-size="10" fill="#41566b">action, before/after snapshot</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="50" y="730" width="1400" height="280" rx="10" fill="#fafbfc" stroke="#dfe5ea"/>
    <text x="70" y="760" font-size="14" font-weight="700" fill="#1a2c3d">Relationship summary (cardinality)</text>
    <text x="70" y="788" font-size="12" fill="#1a2c3d">USER (1) &#8212;&lt; (N) ACCOUNT &#8212; one user can hold several accounts (current, savings, investment wallet, etc.)</text>
    <text x="70" y="812" font-size="12" fill="#1a2c3d">USER (1) &#8212;&lt; (N) KYC_VERIFICATION &#8212; a user may submit/redo identity verification multiple times</text>
    <text x="70" y="836" font-size="12" fill="#1a2c3d">ACCOUNT (1) &#8212;&lt; (N) LEDGER_ENTRY &#8212; every balance movement on an account is one immutable, append-only row</text>
    <text x="70" y="860" font-size="12" fill="#1a2c3d">TRANSACTION (1) &#8212;&lt; (exactly 2) LEDGER_ENTRY &#8212; double-entry rule: one DEBIT row + one CREDIT row per transaction, always balanced</text>
    <text x="70" y="884" font-size="12" fill="#1a2c3d">ACCOUNT (1) &#8212;&lt; (N) TRANSACTION &#8212; via sender_account_id / receiver_account_id (two separate FK roles on the same table)</text>
    <text x="70" y="908" font-size="12" fill="#1a2c3d">ACCOUNT (1) &#8212;&lt; (N) CARD, ACCOUNT (1) &#8212;&lt; (N) LOAN, ACCOUNT (1) &#8212;&lt; (N) INVOICE, ACCOUNT (1) &#8212;&lt; (N) INVESTMENT_HOLDING</text>
    <text x="70" y="932" font-size="12" fill="#1a2c3d">CARD_PROVIDER (1) &#8212;&lt; (N) CARD &#8212; Visa/Mastercard/Verve each issue many cards across the platform</text>
    <text x="70" y="956" font-size="12" fill="#1a2c3d">LOAN (1) &#8212;&lt; (N) LOAN_REPAYMENT_SCHEDULE &#8212; amortization rows, one per installment due-date</text>
    <text x="70" y="980" font-size="12" fill="#1a2c3d">SECURITY (1) &#8212;&lt; (N) INVESTMENT_HOLDING, USER (1) &#8212;&lt; (N) EXTERNAL_BROKERAGE_LINK &#8212; sync source for the holdings API pull</text>
    <text x="70" y="998" font-size="11" fill="#a33" font-style="italic">Note: LEDGER_ENTRY is the architectural core of the whole system &#8212; see Section 4 for why it replaces stored balance/list fields.</text>
  </g>

  <!-- ============ CONNECTORS ============ -->
  <!-- USER -> ACCOUNT -->
  <path d="M240,165 L330,170" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#crow)"/>
  <!-- USER -> KYC -->
  <path d="M145,206 L145,250" fill="none" stroke="#5b6b7c" stroke-width="1.6" marker-end="url(#crow)"/>
  <!-- ACCOUNT -> CURRENCY -->
  <path d="M530,150 C580,125 600,100 640,82" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#crow)"/>
  <!-- ACCOUNT -> LEDGER -->
  <path d="M530,185 C565,195 580,200 610,205" fill="none" stroke="#1f9d61" stroke-width="1.8" marker-end="url(#crow)"/>
  <!-- LEDGER -> TRANSACTION -->
  <path d="M820,200 L900,195" fill="none" stroke="#1f9d61" stroke-width="1.8" marker-end="url(#crow)"/>
  <!-- TRANSACTION -> CARD -->
  <path d="M1005,250 L1005,290" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#crow)"/>
  <!-- CARD -> PROVIDER -->
  <path d="M1110,335 L1180,330" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#crow)"/>
  <!-- CARD -> ACCOUNT (back ref, dashed loop) -->
  <path d="M900,310 C700,300 560,260 530,200" fill="none" stroke="#5b6b7c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#crow)"/>
  <!-- ACCOUNT -> LOAN -->
  <path d="M430,220 L430,420" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#crow)"/>
  <!-- LOAN -> SCHEDULE -->
  <path d="M330,470 L270,466" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#crow)"/>
  <!-- ACCOUNT -> INVOICE -->
  <path d="M520,220 C580,300 620,360 660,420" fill="none" stroke="#5b6b7c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#crow)"/>
  <!-- ACCOUNT -> INVESTMENT -->
  <path d="M530,200 C760,260 880,360 950,450" fill="none" stroke="#5b6b7c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#crow)"/>
  <!-- INVESTMENT -> SECURITY -->
  <path d="M1110,495 L1180,485" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#crow)"/>
  <!-- INVESTMENT -> EXTLINK -->
  <path d="M1110,540 C1140,560 1160,575 1180,585" fill="none" stroke="#5b6b7c" stroke-width="1.4" marker-end="url(#crow)"/>
  <!-- USER -> EXTLINK (long dashed) -->
  <path d="M240,180 C700,260 1050,420 1180,580" fill="none" stroke="#6a4c93" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#crow)"/>
  <!-- everything -> AUDIT (conceptual, dashed) -->
  <path d="M145,320 L145,600" fill="none" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="2,3" marker-end="url(#crow)"/>
</svg>
